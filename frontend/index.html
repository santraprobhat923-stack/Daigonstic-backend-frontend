<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aarogyam</title><style>body{margin:0;background:#f5f7fb;font:15px Arial;color:#172033}header{background:white;padding:14px 18px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:white;padding:18px;border:1px solid #e1e6ef;border-radius:14px;margin:12px 0}.nav button,button{padding:10px 14px;border:0;border-radius:8px;margin:4px;cursor:pointer}.primary{background:#1769e0;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field input,.field select{padding:10px;border:1px solid #ccd3df;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{padding:8px;min-width:120px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}.muted{color:#667085}.badge{background:#eef2f6;padding:4px 7px;border-radius:20px}@media(max-width:600px){.wrap{padding:10px}}</style></head><body><header><b>Aarogyam</b><span id="user"></span></header><main class="wrap" id="app"></main><script>
let cid=localStorage.cid; const $=id=>document.getElementById(id); const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(u,o={}){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||"Request failed");return j}
function login(){app.innerHTML='<div class="card" style="max-width:420px;margin:10vh auto"><h2>Centre Login</h2><div class="field"><label>Email</label><input id="e"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="primary" onclick="doLogin()">Login</button><button onclick="create()">Create demo centre</button></div>'}
async function doLogin(){try{let f=new URLSearchParams({email:e.value,password:p.value}),j=await api("/api/login",{method:"POST",body:f});cid=j.centre_id;localStorage.cid=cid;dash()}catch(x){alert(x.message)}}
async function create(){let name=prompt("Centre name"),email=prompt("Email"),password=prompt("Password");if(name&&email&&password){await api("/api/bootstrap",{method:"POST",body:new URLSearchParams({name,email,password})});alert("Created. Login.")}}
function nav(){return '<div class="nav"><button onclick="dash()">Dashboard</button><button onclick="capture()">New Report</button><button onclick="reports()">Reports</button><button onclick="notes()">Notifications</button><button onclick="settings()">Settings</button><button onclick="logout()">Logout</button></div>'}
async function dash(){let r=await api("/api/reports?centre_id="+cid);app.innerHTML=nav()+'<div class="grid"><div class="card"><b>Core flow</b><p>Image → OCR → Verify → PDF → Payment → WhatsApp</p></div><div class="card"><b>Total reports</b><h2>'+r.length+'</h2></div></div><div class="card"><h3>Recent reports</h3>'+rows(r)+'</div>'}
function capture(){app.innerHTML=nav()+'<div class="card"><h2>Upload analyzer/report images</h2><input id="imgs" type="file" accept="image/*" multiple><br><button class="primary" onclick="upload()">OCR & Review</button></div>'}
async function upload(){let f=new FormData();[...imgs.files].forEach(x=>f.append("files",x));try{let j=await api("/api/reports/upload?centre_id="+cid,{method:"POST",body:f});verify(j.report.id,j.extracted)}catch(x){alert(x.message)}}
function verify(id,d){let p=d.patient||{};app.innerHTML=nav()+'<div class="card"><h2>Verify Report #'+id+'</h2><div class="grid">'+[['name','Name'],['age','Age'],['sex','Sex'],['phone','WhatsApp number'],['code','Patient ID']].map(a=>'<div class="field"><label>'+a[1]+'</label><input id="v_'+a[0]+'" value="'+esc(p[a[0]])+'"></div>').join('')+'</div><h3>Test results</h3><div id="ts">'+(d.tests||[]).map(t=>'<div class="row test"><input data-k="name" value="'+esc(t.name)+'"><input data-k="value" value="'+esc(t.value)+'"><input data-k="unit" value="'+esc(t.unit)+'"></div>').join('')+'</div><br><button class="primary" onclick="approve('+id+')">Approve & Generate PDF</button></div>'}
async function approve(id){let d={patient:{name:v_name.value,age:v_age.value,sex:v_sex.value,phone:v_phone.value,code:v_code.value},tests:[...document.querySelectorAll(".test")].map(x=>Object.fromEntries([...x.children].map(i=>[i.dataset.k,i.value])))};let f=new FormData();f.append("centre_id",cid);f.append("data",JSON.stringify(d));try{await api("/api/reports/"+id+"/verify",{method:"POST",body:f});pay(id)}catch(x){alert(x.message)}}
function pay(id){app.innerHTML=nav()+'<div class="card"><h2>Report #'+id+'</h2><p>PDF is ready for immediate centre download.</p><button class="primary" onclick="window.open(\'/api/reports/'+id+'/download?centre_id='+cid+'\')">Download PDF</button><hr><h3>Payment</h3><div class="field"><label>Patient charge ₹</label><input id="amt" type="number" min="0" step=".01"></div><div class="field"><label>Status</label><select id="ps"><option value="PAID">Paid</option><option value="DUE">Due / Pending</option></select></div><button class="primary" onclick="savePay('+id+')">Save Payment</button></div>'}
async function savePay(id){try{await api("/api/payments/"+id,{method:"POST",body:new URLSearchParams({centre_id:cid,amount:amt.value||0,status:ps.value})});alert("Saved. WhatsApp automation queued when enabled.");reports()}catch(x){alert(x.message)}}
async function reports(){let r=await api("/api/reports?centre_id="+cid);app.innerHTML=nav()+'<div class="card"><h2>Reports</h2>'+rows(r,true)+'</div>'}
function rows(r){return r.length?'<table class="table"><tr><th>#</th><th>Patient</th><th>Status</th><th>Payment</th><th></th></tr>'+r.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.patient_name)+'</td><td><span class="badge">'+x.status+'</span></td><td>'+x.payment+'</td><td>'+(x.pdf_path!==""?'<button onclick="window.open(\'/api/reports/'+x.id+'/download?centre_id='+cid+'\')">PDF</button>':'')+'</td></tr>').join('')+'</table>':'<p class="muted">No reports</p>'}
async function notes(){let n=await api("/api/notifications?centre_id="+cid);app.innerHTML=nav()+'<div class="card"><h2>Notification Center</h2>'+n.map(x=>'<div class="card"><b>'+x.kind+'</b><p>'+esc(x.message)+'</p><small>'+x.created_at+'</small></div>').join('')+'</div>'}
async function settings(){let s=await api("/api/settings?centre_id="+cid);app.innerHTML=nav()+'<div class="card"><h2>Centre Settings</h2><div class="field"><label>Enable WhatsApp</label><select id="wa"><option value="false">OFF</option><option value="true" '+(s.whatsapp_enabled?'selected':'')+'>ON</option></select></div><div class="field"><label>Active UPI</label><input id="upi" value="'+esc(s.upi_id)+'"></div><p>Credits: <b>'+s.credits+'</b> · Price hook: ₹'+s.credit_price_inr+'/credit</p><button class="primary" onclick="saveSettings()">Save</button><h3>Custom PDF template</h3><input id="tpl" type="file" accept=".pdf"><button onclick="uploadTemplate()">Upload template</button></div>'}
async function saveSettings(){await api("/api/settings?centre_id="+cid,{method:"PUT",body:new URLSearchParams({whatsapp_enabled:wa.value,upi_id:upi.value})});alert("Saved")}
async function uploadTemplate(){let f=new FormData();f.append("centre_id",cid);f.append("file",tpl.files[0]);await api("/api/settings/template",{method:"POST",body:f});alert("Template saved")}
function logout(){localStorage.removeItem("cid");cid=null;login()} if(cid)dash();else login();
</script></body></html>
