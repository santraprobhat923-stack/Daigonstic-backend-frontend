name: Build PDFMe editor bundle

on:
  workflow_dispatch:
  push:
    branches:
      - pdfme-production-bundle
    paths:
      - "tools/pdfme-editor/**"
      - ".github/workflows/build-pdfme-editor.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pdfme-editor/package.json

      - name: Install PDFMe build dependencies
        working-directory: tools/pdfme-editor
        run: npm install --no-audit --no-fund

      - name: Build single browser bundle
        working-directory: tools/pdfme-editor
        run: node build.mjs

      - name: Verify bundle
        run: |
          test -s frontend/pdfme-bundle/designer.js
          node -e 'const fs=require("fs"); const s=fs.readFileSync("frontend/pdfme-bundle/designer.js","utf8"); if (s.includes("node:") || s.includes("@pdfme/") || s.includes("from \"buffer\"") || s.includes("from \"process\"")) process.exit(1);'
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pdfme-bundle/
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
          else
            git commit -m "build: add self-contained PDFMe editor bundle"
            git push
          fi
