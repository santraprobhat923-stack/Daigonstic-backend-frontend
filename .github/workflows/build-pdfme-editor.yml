name: Build PDFMe editor bundle

on:
  workflow_dispatch:
  push:
    branches:
      - pdfme-production-bundle
    paths:
      - "tools/pdfme-editor/**"
      - ".github/workflows/build-pdfme-editor.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pdfme-editor/package.json

      - name: Install PDFMe build dependencies
        working-directory: tools/pdfme-editor
        run: npm install --no-audit --no-fund

      - name: Build single browser bundle
        working-directory: tools/pdfme-editor
        run: node build.mjs

      - name: Verify bundle
        run: |
          test -s frontend/pdfme-bundle/designer.js
          if grep -Eq '@pdfme/|from "buffer"|from "process"|from "node:' frontend/pdfme-bundle/designer.js; then
            echo "Unresolved bare module import found in bundle"
            grep -oE 'from ["'\'''][^"'\''']+' frontend/pdfme-bundle/designer.js | head -30
            exit 1
          fi

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pdfme-bundle/
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
          else
            git commit -m "build: add self-contained PDFMe editor bundle"
            git push
          fi
